# Configuracion minima del stack local de Supabase (CLI 2.122.1). Solo valores locales por
# defecto: sin secretos ni referencias a proyectos remotos. No se ha ejecutado `supabase start`
# en el entorno de desarrollo (sin Docker); se valida en el job `supabase` de CI.
project_id = "nexovantis"

[api]
enabled = true
port = 54321
# Solo public se expone por la API de datos: el esquema private (funciones auxiliares) no.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

# Sin datos semilla: los usuarios de prueba no pueden crearse sin contrasenas, que no se
# versionan. Las pruebas de CI los crean con la API admin (tests/integration/supabase/).
[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600

# Solo stack local: las E2E con Auth real (TASK-007) hacen ~15 inicios de sesion por worker y el
# limite por defecto (30 por 5 min y por IP) se agotaria junto con test:supabase.
[auth.rate_limit]
sign_in_sign_ups = 300

# Servicios no necesarios para F3 (menos consumo en el runner).
[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
